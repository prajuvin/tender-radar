name: Update tenders

on:
  schedule:
    - cron: "17 11 * * *"   # every day, 7:17am Toronto time (EDT)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["radar/**", "tests/**", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update-tenders
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: |
          pip install pytest
          python -m pytest -q
      - name: Download today's open tenders
        run: python -m radar.fetch
      - name: Save if anything changed
        run: |
          git config user.name "tender-radar-bot"
          git config user.email "tender-radar-bot@users.noreply.github.com"
          git add docs/data/tenders.json
          if git diff --cached --quiet; then
            echo "No change today."
          else
            git commit -m "Update open tenders $(date -u +%Y-%m-%d)"
            git push
          fi
